  <!-- GSAP Animation + Web Audio SFX Logic -->
  <script>
    let timeline;

    // ब्राउज़र सिंथेसाइज़र से टेक साउंड जनरेट करने वाला फ़ंक्शन
    function playTechSound(type = 'pop') {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();

        if (type === 'start') {
          // Sci-Fi Whoosh Sound (शुरुआत के लिए)
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(180, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.35);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.35);
        } else {
          // Soft Tech Click/Pop Sound (हर नोड के खुलने पर)
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(520, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.12);
          gain.gain.setValueAtTime(0.18, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.12);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.12);
        }
      } catch (e) {
        // अगर ब्राउज़र ब्लॉक करे तो एरर इग्नोर करें
      }
    }

    function initAnimation() {
      const paths = document.querySelectorAll('.tree-path');
      paths.forEach(p => {
        const len = p.getTotalLength();
        p.style.strokeDasharray = len;
        p.style.strokeDashoffset = len;
      });

      timeline = gsap.timeline({ defaults: { ease: "power2.out" } });

      timeline
        .add(() => playTechSound('start'))
        .to("#rootNode", { 
          opacity: 1, 
          scale: 1, 
          duration: 0.6,
          onStart: () => playTechSound('pop')
        })
        .to(".tree-path", { 
          strokeDashoffset: 0, 
          duration: 1.2, 
          stagger: 0.15, 
          ease: "power1.inOut" 
        }, "-=0.2")
        .to(".anim-node:not(#rootNode)", { 
          opacity: 1, 
          scale: 1, 
          duration: 0.5, 
          stagger: {
            each: 0.15,
            onStart: function() { playTechSound('pop'); }
          }
        }, "-=0.8");
    }

    // Replay Button पर साउंड के साथ रीस्टार्ट
    document.getElementById("replayBtn").addEventListener("click", () => {
      if (timeline) {
        playTechSound('start');
        timeline.restart();
      }
    });

    document.getElementById("instantBtn").addEventListener("click", () => {
      if (timeline) timeline.progress(1);
    });

    // ब्राउज़र की Autoplay पॉलिसी की वजह से पहली बार स्क्रीन पर कहीं भी टैप/क्लिक होते ही साउंड चालू हो जाएगा
    window.addEventListener("DOMContentLoaded", initAnimation);
  </script>
